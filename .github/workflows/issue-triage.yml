name: Issue triage

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "要清理自动标签的 issue 编号"
        required: true
        type: number

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Remove automatic issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            // workflow_dispatch 没有 context.payload.issue，需按输入的编号读取。
            const issueNumber = Number(context.payload.inputs?.issue_number || context.payload.issue?.number);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed("缺少有效的 issue_number 输入");
              return;
            }
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const automaticLabels = new Set([
              "needs triage",
              "type: bug",
              "type: feature",
              "type: config",
              "type: question",
              "area: provider-config",
              "area: protocol",
              "area: context-tools",
              "area: model-catalog",
              "area: ui",
              "area: build"
            ]);

            const labelsToRemove = issue.labels
              .map((label) => typeof label === "string" ? label : label.name)
              .filter((name) => automaticLabels.has(name));

            for (const name of labelsToRemove) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issue.number,
                name
              });
            }
