[package]
name = "chatgptx-gpui"
default-run = "chatgptx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
visual-audit = ["gpui-kit/test-support"]

[[bin]]
name = "chatgptx"
path = "src/main.rs"

[[bin]]
name = "chatgptx-legacy-shim"
path = "src/legacy_shim.rs"

[dependencies]
anyhow.workspace = true
chatgptx-backend = { path = "../../crates/chatgptx-backend" }
chatgptx-core = { path = "../../crates/chatgptx-core" }
chatgptx-data = { path = "../../crates/chatgptx-data" }
chatgptx-launcher = { path = "../chatgptx-launcher" }
gpui-kit = { version = "0.10.0", features = ["tree-sitter-toml"] }
png = "0.17"
rfd = "0.16"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tray-icon = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
