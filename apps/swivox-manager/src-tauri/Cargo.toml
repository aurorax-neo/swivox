[package]
name = "swivox-manager"
default-run = "swivox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "swivox_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "swivox"
path = "src/main.rs"

[[bin]]
name = "swivox-legacy-shim"
path = "src/legacy_shim.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
swivox-core = { path = "../../../crates/swivox-core" }
swivox-data = { path = "../../../crates/swivox-data" }
swivox-launcher = { path = "../../swivox-launcher" }
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["protocol-asset", "custom-protocol", "tray-icon"] }
tauri-plugin-dialog = "2"
toml_edit.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
