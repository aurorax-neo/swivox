<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Swivox — 原生 GPUI 驱动的 Codex 多账号与供应商控制中心">
  <title>Swivox — 让 Codex 更顺手</title>
  <desc>深色曜石蓝背景与青紫双色棱镜切换徽标，展示 Swivox 原生 Rust + GPUI 工作台、多官方账号、供应商路由与客户端增强。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F1E"/>
      <stop offset="0.55" stop-color="#111730"/>
      <stop offset="1" stop-color="#1A1B3A"/>
    </linearGradient>
    <linearGradient id="cyanRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="violetRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#93A8FF" fill-opacity=".14"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="660" width="540" height="320" rx="20" fill="url(#dots)"/>
  <path d="M690 320L1010 0M810 320L1130 0" stroke="#7B93FF" stroke-opacity=".08"/>

  <!-- Left Brand Column -->
  <rect x="56" y="46" width="4" height="20" rx="2" fill="url(#cyanRibbon)"/>
  <text x="73" y="61" fill="#9FB0D8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.8">NATIVE RUST + GPUI CODEX HUB</text>

  <text x="54" y="146" fill="#F6F8FF" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">Swi<tspan fill="#6FD6FF">vox</tspan></text>

  <text x="56" y="206" fill="#E8EEFC" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="33" font-weight="600">让 Codex 桌面工作流更自由、更顺手。</text>
  <text x="56" y="258" fill="#9AA7C7" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15.5">多官方账号与配额 · 25+ 供应商协议路由 · 每模型窗口目录 · 独立多开与增强</text>

  <!-- Right GPUI Window Preview -->
  <rect x="742" y="54" width="396" height="212" rx="16" fill="#0E1324" stroke="#313B5E" stroke-width="1.2"/>
  <path d="M742 92H1138" stroke="#26304E"/>
  <circle cx="766" cy="73" r="4.2" fill="#FF6B81"/>
  <circle cx="782" cy="73" r="4.2" fill="#F5B95F"/>
  <circle cx="798" cy="73" r="4.2" fill="#4FD19B"/>
  <text x="820" y="77" fill="#8B98BA" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">Swivox — Native GPUI Control Center</text>

  <!-- Sidebar mock -->
  <rect x="758" y="108" width="76" height="142" rx="9" fill="#151C33"/>
  <rect x="768" y="122" width="56" height="22" rx="6" fill="#4F6BFF" fill-opacity=".26"/>
  <rect x="776" y="131" width="38" height="4" rx="2" fill="#9DB6FF"/>
  <rect x="776" y="158" width="42" height="4" rx="2" fill="#4D5B82"/>
  <rect x="776" y="178" width="34" height="4" rx="2" fill="#4D5B82"/>
  <rect x="776" y="198" width="40" height="4" rx="2" fill="#4D5B82"/>
  <rect x="776" y="218" width="30" height="4" rx="2" fill="#4D5B82"/>

  <!-- Main Workspace Cards -->
  <rect x="848" y="108" width="274" height="38" rx="9" fill="#18213B"/>
  <rect x="862" y="124" width="118" height="5" rx="2.5" fill="#90A2CD"/>
  <rect x="1056" y="118" width="52" height="18" rx="6" fill="#5468FF"/>

  <rect x="848" y="158" width="132" height="92" rx="10" fill="#151C33" stroke="#263154"/>
  <rect x="862" y="174" width="66" height="5" rx="2.5" fill="#A5B6DE"/>
  <rect x="862" y="190" width="92" height="4" rx="2" fill="#4D5B82"/>
  <rect x="862" y="206" width="104" height="6" rx="3" fill="#232E4D"/>
  <rect x="862" y="206" width="84" height="6" rx="3" fill="#46D39A"/>
  <rect x="862" y="224" width="46" height="14" rx="5" fill="#223B38"/>

  <!-- Swivox S-Prism Emblem Card -->
  <rect x="992" y="158" width="130" height="92" rx="10" fill="#151C33" stroke="#2F3B66"/>
  <g transform="translate(1057 204)">
    <path d="M-24 -22 L18 -22 L10 -12 L-14 -12 L-4 -2 L-12 6 L-28 -10 Z" fill="url(#cyanRibbon)"/>
    <path d="M24 22 L-18 22 L-10 12 L14 12 L4 2 L12 -6 L28 10 Z" fill="url(#violetRibbon)"/>
  </g>
</svg>
